name: ragir_chat
description: Ragir Chat
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  image_picker: any
  http: any

dev_dependencies:
  flutter_launcher_icons: any

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  adaptive_icon_background: "#0F8A5F"
  adaptive_icon_foreground: "icon_fg.png"

flutter:
  uses-material-design: true
