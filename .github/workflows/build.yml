name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.nasreen.ragirchat --project-name ragir_chat .
          fi

      - name: Make Firebase options from google-services.json
        run: |
          API_KEY=$(jq -r '.client[0].api_key[0].current_key' google-services.json)
          APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id' google-services.json)
          SENDER=$(jq -r '.project_info.project_number' google-services.json)
          PROJECT=$(jq -r '.project_info.project_id' google-services.json)
          BUCKET=$(jq -r '.project_info.storage_bucket' google-services.json)
          cat > lib/firebase_options.dart <<EOF
          import 'package:firebase_core/firebase_core.dart';

          const firebaseOptions = FirebaseOptions(
            apiKey: '$API_KEY',
            appId: '$APP_ID',
            messagingSenderId: '$SENDER',
            projectId: '$PROJECT',
            storageBucket: '$BUCKET',
          );
          EOF

      - run: flutter pub add record audioplayers gal video_player flutter_webrtc file_picker geolocator url_launcher google_fonts flutter_tts camera shared_preferences crypto firebase_messaging http && flutter pub get

      - name: Enlarge icon logo
        continue-on-error: true
        run: |
          python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
          python3 -c "from PIL import Image; im=Image.open('icon_fg.png').convert('RGBA'); n=int(1024*1.18); im=im.resize((n,n),Image.LANCZOS); o=(n-1024)//2; im.crop((o,o,o+1024,o+1024)).save('icon_fg.png')"

      - name: Make app icon
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="Rahgeer Chat"/' android/app/src/main/AndroidManifest.xml

      - name: Allow internet and mic
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Allow text to speech service
        run: |
          sed -i 's|<application|<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "queries" android/app/src/main/AndroidManifest.xml

      - name: Set minimum Android version for calls
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/minSdk(Version)?( =|) flutter\.minSdkVersion/minSdk\1\2 24/' "$f"
            grep -n "minSdk" "$f"
          done

      - name: Make notification channels for popups
        run: |
          D=android/app/src/main/kotlin/com/nasreen/ragirchat
          mkdir -p "$D"
          rm -f android/app/src/main/java/com/nasreen/ragirchat/MainActivity.java
          cat > "$D/MainActivity.kt" <<'EOF'
          package com.nasreen.ragirchat

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.os.Build
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 26) {
                      val m = getSystemService(NotificationManager::class.java)
                      m.createNotificationChannel(NotificationChannel("calls", "Calls", NotificationManager.IMPORTANCE_HIGH))
                      m.createNotificationChannel(NotificationChannel("messages", "Messages", NotificationManager.IMPORTANCE_HIGH))
                  }
              }
          }
          EOF
          cat "$D/MainActivity.kt" | head -5

      - name: Build small APK
        run: |
          for i in 1 2 3; do
            flutter build apk --release --split-per-abi && break
            echo "Build failed, attempt $i"
            if [ "$i" = "3" ]; then exit 1; fi
            sleep 60
          done

      - name: Sign APK with our secret key
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ragir.jks"
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          cd build/app/outputs/flutter-apk
          "${BT}apksigner" sign --ks "$RUNNER_TEMP/ragir.jks" --ks-key-alias ragir --ks-pass env:KS_PASS --out Rahgeer-Chat.apk app-arm64-v8a-release.apk
          "${BT}apksigner" verify --print-certs Rahgeer-Chat.apk | head -3

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Ragir Chat v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/Rahgeer-Chat.apk
